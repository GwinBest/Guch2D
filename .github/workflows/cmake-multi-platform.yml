# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [debug, release]
        c_compiler: [gcc-14, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc-14
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc-14

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake via Presets
      run: |
        cmake --preset ${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        
    - name: Build
      run: cmake --build Build/${{ matrix.build_type }} --config ${{ matrix.build_type }}

    - name: Test
      run: ctest --test-dir Build/${{ matrix.build_type }} --output-on-failure

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install LLVM 22 tools
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
        sudo apt-get update
        sudo apt-get install -y clang-format-22 clang-tidy-22

    - name: Configure CMake (strict lint mode via Presets)
      run: >
        cmake --preset debug
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
        -DBUILD_TEST=ON
        -DENABLE_ASAN=OFF
        -DENABLE_UBSAN=OFF
        -DENABLE_CLANG_TIDY=ON
        -DENABLE_CLANG_FORMAT=ON
        -DENABLE_LINT_STRICT=ON
        -DCLANG_TIDY_EXE=/usr/lib/llvm-22/bin/clang-tidy
        -DCLANG_FORMAT_EXE=/usr/lib/llvm-22/bin/clang-format

    - name: Check formatting
      run: cmake --build Build/Debug --target format-check

    - name: Build with clang-tidy
      run: cmake --build Build/Debug --config Debug
